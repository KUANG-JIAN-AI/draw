<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>エアジェスチャー画板</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}?v=1.0.0">
  </head>
  <body>
    <main class="app">
      <header class="toolbar" aria-label="绘画工具">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span data-i18n="title">隔空手势画板</span>
        </div>

        <div class="tool-group lang-group">
          <button id="langZhBtn" class="tool-button lang-btn" type="button">中文</button>
          <button id="langJaBtn" class="tool-button lang-btn" type="button">日本語</button>
        </div>

        <button id="cameraButton" class="tool-button primary" type="button" data-i18n="camera_button">开启摄像头</button>

        <div class="tool-group" style="gap:8px;">
          <input id="roomInput" maxlength="80" aria-label="房间名" class="field-input" type="text" data-i18n-placeholder="room_placeholder" placeholder="房间名 (默认 lobby)">
          <input id="nameInput" maxlength="40" aria-label="昵称" class="field-input" type="text" data-i18n-placeholder="name_placeholder" placeholder="昵称 (可选)">
          <button id="joinRoomButton" class="tool-button" type="button" data-i18n="join_room_button">加入房间</button>
        </div>

        <div class="tool-group color-group" aria-label="颜色">
          <button class="swatch active" type="button" data-color="#111827" style="--swatch:#111827" aria-label="黑色"></button>
          <button class="swatch" type="button" data-color="#e11d48" style="--swatch:#e11d48" aria-label="玫红"></button>
          <button class="swatch" type="button" data-color="#f59e0b" style="--swatch:#f59e0b" aria-label="琥珀"></button>
          <button class="swatch" type="button" data-color="#10b981" style="--swatch:#10b981" aria-label="绿色"></button>
          <button class="swatch" type="button" data-color="#2563eb" style="--swatch:#2563eb" aria-label="蓝色"></button>
          <label class="color-picker">
            <input id="customColor" type="color" value="#111827" aria-label="自定义颜色">
          </label>
        </div>

        <div class="size-toggle" data-i18n-label="line_thickness">
          <button class="size-option active" type="button" data-size="8" data-i18n="thin">细</button>
          <button class="size-option" type="button" data-size="24" data-i18n="thick">粗</button>
        </div>

        <div class="tool-group comfort-tools">
          <label><span data-i18n="smoothing">防抖</span> <select id="smoothingLevel" aria-label="防抖强度" data-i18n-label="smoothing"><option value="0" data-i18n="smoothing_off">关闭</option><option value="0.55" selected data-i18n="smoothing_medium">适中</option><option value="0.3" data-i18n="smoothing_strong">强</option></select></label>
          <button id="precisionButton" data-i18n="precision_mode" class="tool-button" type="button" aria-pressed="false">精细模式</button>
          <button id="fillButton" data-i18n="fill" class="tool-button" type="button" aria-pressed="false">区域填色</button>
        </div>
        <div class="tool-group actions" data-i18n-label="operations">
          <button id="eraserButton" class="tool-button" type="button" aria-pressed="false" data-i18n="eraser">橡皮</button>
          <button id="undoButton" class="tool-button" type="button" data-i18n="undo">撤销</button>
          <button id="clearButton" class="tool-button danger" type="button" data-i18n="clear">清空</button>
          <button id="saveButton" class="tool-button" type="button" data-i18n="save">保存</button>
          <button id="generateButton" class="tool-button primary" type="button" data-i18n="ai_generate">AI 生成</button>
          <button id="aiToggle" aria-expanded="false" aria-controls="aiPanel" class="tool-button" type="button" data-i18n="ai_preview">图片预览</button>
        </div>
      </header>

      <section class="stage" aria-label="手势画布">
        <canvas id="drawingCanvas"></canvas>
        <canvas id="gestureCanvas"></canvas>
        <div class="zoom-help" data-i18n="menu_canvas_hint">双手捏合缩放；松手抬笔；精细模式下笔尖移动减半；填色时捏合一次</div>
        <div class="zoom-controls" role="group" data-i18n-label="zoom_controls" aria-label="画布缩放">
          <button id="zoomOut" class="tool-button" type="button" data-i18n-label="zoom_out" aria-label="缩小">−</button>
          <button id="zoomReset" class="tool-button zoom-value" type="button" data-i18n-label="zoom_reset" aria-label="恢复 100%">100%</button>
          <button id="zoomIn" class="tool-button" type="button" data-i18n-label="zoom_in" aria-label="放大">+</button>
          <button id="zoomFit" class="tool-button" type="button" data-i18n="zoom_fit">适应窗口</button>
        </div>

        <div class="camera-preview" aria-label="摄像头预览">
          <video id="cameraView" playsinline muted></video>
        </div>

        <button id="gestureMenuToggle" class="tool-button gesture-menu-toggle" type="button" aria-expanded="false" aria-controls="gestureMenu" data-i18n="menu_tools">工具</button>
        <div id="fistProgress" class="fist-progress" hidden role="status"></div>
        <section id="gestureMenu" class="gesture-menu" hidden aria-label="快捷工具" data-i18n-label="menu_title">
          <header class="gesture-menu-header"><strong data-i18n="menu_title">快捷工具</strong><span data-i18n="menu_hint">指向按钮停留选择；再次握拳关闭</span></header>
        <div class="menu-drawing" aria-label="绘画手势工具栏">
          <div class="gesture-panel color-pad">
            <button class="gesture-tool swatch active" type="button" data-gesture-action="color" data-color="#111827" style="--swatch:#111827" aria-label="黑色"></button>
            <button class="gesture-tool swatch" type="button" data-gesture-action="color" data-color="#e11d48" style="--swatch:#e11d48" aria-label="玫红"></button>
            <button class="gesture-tool swatch" type="button" data-gesture-action="color" data-color="#f59e0b" style="--swatch:#f59e0b" aria-label="琥珀"></button>
            <button class="gesture-tool swatch" type="button" data-gesture-action="color" data-color="#10b981" style="--swatch:#10b981" aria-label="绿色"></button>
            <button class="gesture-tool swatch" type="button" data-gesture-action="color" data-color="#2563eb" style="--swatch:#2563eb" aria-label="蓝色"></button>
          </div>

          <div class="gesture-panel">
            <button class="gesture-tool gesture-button active" type="button" data-gesture-action="size" data-size="8" data-i18n="thin">细</button>
            <button class="gesture-tool gesture-button" type="button" data-gesture-action="size" data-size="24" data-i18n="thick">粗</button>
          </div>

          <div class="gesture-panel">
            <button class="gesture-tool gesture-button" type="button" data-gesture-action="precision" data-i18n="precision">精细</button>
            <button class="gesture-tool gesture-button" type="button" data-gesture-action="fill" data-i18n="fill">填色</button>
            <button class="gesture-tool gesture-button" type="button" data-gesture-action="eraser" data-i18n="eraser">橡皮</button>
            <button class="gesture-tool gesture-button" type="button" data-gesture-action="undo" data-i18n="undo">撤销</button>
            <button class="gesture-tool gesture-button danger" type="button" data-gesture-action="clear" data-i18n="clear">清空</button>
            <button class="gesture-tool gesture-button" type="button" data-gesture-action="save" data-i18n="save">保存</button>
          </div>
        </div>

        <div class="menu-ai" aria-label="AI 手势工具栏">
          <div class="gesture-panel gesture-ai-panel">
            <button id="gestureAiStyleButton" class="gesture-tool gesture-button compact" type="button" data-gesture-action="ai-style">风格</button>
            <button id="gestureAiSizeButton" class="gesture-tool gesture-button compact" type="button" data-gesture-action="ai-size">尺寸</button>
            <button id="gestureAiModelButton" class="gesture-tool gesture-button compact" type="button" data-gesture-action="ai-model">模型</button>
            <button id="gestureAiGenerateButton" class="gesture-tool gesture-button primary" type="button" data-gesture-action="ai-generate" data-i18n="ai_generate">AI 生成</button>
          </div>
        </div>

          <div id="menuConfirmation" class="menu-confirmation" hidden>
            <span id="menuConfirmText"></span>
            <button class="gesture-tool gesture-button" data-gesture-action="confirm" type="button" data-i18n="menu_confirm">确认</button>
            <button class="gesture-tool gesture-button" data-gesture-action="cancel" type="button" data-i18n="menu_cancel">取消</button>
          </div>
          <button class="gesture-tool gesture-button menu-close" data-gesture-action="close" type="button" data-i18n="menu_back">返回画画</button>
        </section>

        <div class="hud" aria-live="polite">
          <span id="statusDot" class="status-dot"></span>
          <span id="statusText" data-i18n="menu_canvas_hint">先开启摄像头；松开捏合后握拳打开工具，捏合画画，张掌拖动画布</span>
          <div id="membersList" class="members-list"></div>
        </div>

        <select id="aiModelSelect" hidden>
          {% for value, label in image_models.items() %}
          <option value="{{ value }}">{{ label }}</option>
          {% endfor %}
        </select>
        <aside id="aiPanel" hidden class="ai-panel" aria-label="AI 图生图">
          <div class="ai-panel-header">
            <strong data-i18n="ai_panel_title">AI 图生图</strong>
            <span id="aiStatus" class="ai-status" data-i18n="ai_idle">准备就绪</span>
          </div>

          <div class="ai-result-wrap">
            <div class="image-comparison">
              <figure class="comparison-item">
                <figcaption data-i18n="comparison_original">绘画原图</figcaption>
                <div class="comparison-preview">
                  <img id="aiOriginalImage" class="ai-result" alt="本次生成使用的绘画原图" data-i18n-label="comparison_original">
                  <span class="comparison-empty" data-i18n="comparison_original_empty">生成后展示本次绘画快照</span>
                </div>
              </figure>
              <figure class="comparison-item">
                <figcaption data-i18n="comparison_generated">AI 生成图</figcaption>
                <div class="comparison-preview">
                  <img id="aiResultImage" class="ai-result" alt="AI 生成结果" data-i18n-label="comparison_generated">
                  <span class="comparison-empty" data-i18n="comparison_generated_empty">生成后在这里查看效果</span>
                </div>
              </figure>
            </div>
            <div id="aiResultLoading" class="ai-result-loading" aria-live="polite" aria-hidden="true">
              <span class="ai-loader" aria-hidden="true"></span>
              <span data-i18n="ai_result_loading">正在生成图片</span>
            </div>
          </div>
        </aside>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" integrity="sha384-q1KhAZhJcJXr3zfC3Tz07pBqQSabwFIZhXlmlUAB8s0zk4ETWERkIKGBCFQ5Jc3e" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" integrity="sha384-oHwoZ9HyKv5ark5VOH+XWdbNfmhYtptAOBuV8plz6mAfXvTA6d8fULuYllWouEK2" crossorigin="anonymous"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js" integrity="sha384-mZLF4UVrpi/QTWPA7BjNPEnkIfRFn4ZEO3Qt/HFklTJBj/gBOV8G3HcKn4NfQblz" crossorigin="anonymous"></script>
    <script src="{{ url_for('static', filename='i18n.js') }}"></script>
    <script type="module" src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
